name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  # The live smoke test is manual on purpose: it writes to a real Shared Drive and spends
  # Google quota, so it runs when someone asks for it rather than on every push.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (PHP ${{ matrix.php }}, Symfony ${{ matrix.symfony }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.1', '8.2', '8.3', '8.4', '8.5' ]
        symfony: [ '6.4.*', '7.*' ]
        exclude:
          # Symfony 7 requires PHP 8.2+
          - php: '8.1'
            symfony: '7.*'
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Pin Symfony version
        run: |
          composer require --no-update --dev \
            symfony/console:${{ matrix.symfony }} \
            symfony/security-core:${{ matrix.symfony }}
          composer require --no-update \
            symfony/config:${{ matrix.symfony }} \
            symfony/dependency-injection:${{ matrix.symfony }} \
            symfony/http-kernel:${{ matrix.symfony }}

      - name: Install dependencies
        run: composer update --prefer-dist --no-progress --no-interaction

      - name: Run tests
        run: vendor/bin/phpunit

  lowest-dependencies:
    name: Tests (lowest supported dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
          tools: composer:v2

      - name: Install the oldest versions composer.json allows
        run: composer update --prefer-lowest --prefer-stable --prefer-dist --no-progress --no-interaction

      - name: Run tests
        run: vendor/bin/phpunit

      # The oldest dependencies are where an annotation narrows and the analysis starts disagreeing
      # with the runtime, so this job checks the analysis too rather than only the tests.
      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      # 128M is not enough for this codebase: the worker dies rather than reporting.
      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

  live-smoke-test:
    name: Live smoke test (real Shared Drive)
    # Manual only, and it needs the four credentials as repository secrets. Without them the
    # script refuses cleanly and the job reports why rather than failing on a stack trace.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Check the credentials are configured
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        run: |
          if [ -z "$GOOGLE_CLIENT_ID" ]; then
            echo "::warning::No GOOGLE_CLIENT_ID secret is set, so there is no drive to talk to."
            echo "Add GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, GOOGLE_SHARED_DRIVE_ID and"
            echo "GOOGLE_OAUTH_REFRESH_TOKEN as repository secrets to run this."
            exit 1
          fi

      - name: Run it
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_SHARED_DRIVE_ID: ${{ secrets.GOOGLE_SHARED_DRIVE_ID }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          SMOKE_SECOND_EMAIL: ${{ secrets.SMOKE_SECOND_EMAIL }}
          SMOKE_PREFIX: ci_smoke_${{ github.run_id }}_
        run: php tools/smoke-test.php
