name: CI

on:
  push:
    branches: [ main ]
  pull_request:

  # The live smoke test writes to a real Shared Drive and spends Google quota, so it never runs on
  # a push. It runs when asked for, and once a week as a canary: this bundle leans on behaviour
  # Google documents thinly or not at all — which pairings of item and role may carry an expiry,
  # what a limited-access folder reports, how long an index takes to catch up — and a weekly run is
  # how that turns into a build failure rather than into someone's bug report.
  schedule:
    - cron: '17 6 * * 1'

  workflow_dispatch:
    inputs:
      live:
        description: 'Also run the live smoke test against the real Shared Drive'
        required: false
        type: boolean
        default: false

  # Called by the release workflow, which will not tag anything until all of this is green.
  workflow_call:
    inputs:
      live:
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  tests:
    name: Tests (PHP ${{ matrix.php }}, Symfony ${{ matrix.symfony }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.1', '8.2', '8.3', '8.4', '8.5' ]
        symfony: [ '6.4.*', '7.*' ]
        exclude:
          # Symfony 7 requires PHP 8.2+
          - php: '8.1'
            symfony: '7.*'
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Pin Symfony version
        run: |
          composer require --no-update --dev \
            symfony/console:${{ matrix.symfony }} \
            symfony/security-core:${{ matrix.symfony }}
          composer require --no-update \
            symfony/config:${{ matrix.symfony }} \
            symfony/dependency-injection:${{ matrix.symfony }} \
            symfony/http-kernel:${{ matrix.symfony }}

      - name: Install dependencies
        run: composer update --prefer-dist --no-progress --no-interaction

      - name: Run tests
        run: vendor/bin/phpunit

  lowest-dependencies:
    name: Tests (lowest supported dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
          tools: composer:v2

      - name: Install the oldest versions composer.json allows
        run: composer update --prefer-lowest --prefer-stable --prefer-dist --no-progress --no-interaction

      - name: Run tests
        run: vendor/bin/phpunit

      # The oldest dependencies are where an annotation narrows and the analysis starts disagreeing
      # with the runtime, so this job checks the analysis too rather than only the tests.
      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      # Cheap, and the kind of thing that is embarrassing to discover from Packagist.
      - name: Validate composer.json
        run: composer validate --strict --no-check-publish

      # 128M is not enough for this codebase: the worker dies rather than reporting.
      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

  live-smoke-test:
    name: Live smoke test (real Shared Drive)
    # Weekly, or when a run asks for it. Never on a push: it writes to a real drive.
    if: github.event_name == 'schedule' || inputs.live
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Check the credentials are configured
        id: credentials
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        run: |
          if [ -n "$GOOGLE_CLIENT_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "configured=false" >> "$GITHUB_OUTPUT"
          echo "::warning::No GOOGLE_CLIENT_ID secret is set, so there is no drive to talk to."
          echo "Add GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, GOOGLE_SHARED_DRIVE_ID and"
          echo "GOOGLE_OAUTH_REFRESH_TOKEN as repository secrets to run this."

          # A weekly run on a fork that never configured the secrets is a repository which has not
          # opted in, not a failure. Asking for the run and not having them is a mistake worth
          # hearing about.
          if [ "${{ github.event_name }}" = "schedule" ]; then
            exit 0
          fi

          exit 1

      - name: Run it
        if: steps.credentials.outputs.configured == 'true'
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_SHARED_DRIVE_ID: ${{ secrets.GOOGLE_SHARED_DRIVE_ID }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          SMOKE_SECOND_EMAIL: ${{ secrets.SMOKE_SECOND_EMAIL }}
          SMOKE_PREFIX: ci_smoke_${{ github.run_id }}_
        run: php tools/smoke-test.php
